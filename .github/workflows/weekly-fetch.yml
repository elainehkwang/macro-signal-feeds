name: Weekly Macro Feed Fetch

# 每周六 06:00 HKT = 每周五 22:00 UTC（HKT 无夏令时，UTC+8 固定）
# 2026-11-14 由每日改为每周：宏观信号改为周六 06:00 抓取 + 07:00 出周报
on:
  schedule:
    - cron: "0 22 * * 5"   # Fri 22:00 UTC = Sat 06:00 HKT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install httpx
      # 注意：Substack 类源对 GitHub Actions 的 IP 会 403/空返回，
      # 主通道是本地 Mac 跑（DSH 周六 06:00 任务）。这里是次级快照/兜底。
      - run: python scripts/generate_feeds.py
      - name: Commit & push
        run: |
          git config user.name "macro-signal-bot"
          git config user.email "bot@macro-signal-feeds.local"
          git add feeds/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "auto: weekly feed update $(date -u +%Y-%m-%d)"
            git push
          fi
